# Copied from Cira's crates/daemon/src/tmux.conf at Cira master 7cae55b (PLAN SES-02): the
# config Cira's tmux server runs, so jc's tests attach to a shell set up as Jay's are.
# Cira's own tmux server (DESIGN 12, PLAN SES-02): `tmux -S $CIRA_HOME/tmux.sock -f <this>`,
# never Jay's default server or ~/.tmux.conf. It makes tmux invisible: no prefix key, so every
# key reaches the shell, and no status bar, since JC and the page name the shell themselves.
set -g prefix None
set -g prefix2 None
set -g status off
set -sg escape-time 0
# Attached clients share one size, the latest client's, as `claude attach` does.
set -g window-size latest
# The wheel scrolls back, through copy-mode.
set -g mouse on
set -g history-limit 50000
# Shift-enter's ESC[13;2u and the like reach the shell as sent.
set -sg extended-keys on
set -sg extended-keys-format csi-u
set -g default-terminal tmux-256color
set -sa terminal-features ',*:RGB'
# OSC 52: a copy in the shell reaches the client's clipboard.
set -sg set-clipboard on
# The server stays up with no shells, so the next one starts without a new server.
set -sg exit-empty off
